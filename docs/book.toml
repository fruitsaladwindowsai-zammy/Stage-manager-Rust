[book]
title = "Stage Manager for Windows"
description = "Native macOS-style Stage Manager for Windows 10 and 11 written in Rust"
authors = ["Stage Manager contributors"]
language = "en"
src = "src"

[build]
build-dir = "book"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/fruitsaladwindowsai-zammy/Stage-manager-Rust"
edit-url-template = "https://github.com/fruitsaladwindowsai-zammy/Stage-manager-Rust/edit/master/docs/{path}"
