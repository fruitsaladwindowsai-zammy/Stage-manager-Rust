name: Build and Release Windows Installer

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run unit tests
        run: cargo test --bin stage_manager

      - name: Build Stage Manager and standalone Setup EXE
        shell: pwsh
        run: ./scripts/build-installer.ps1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stage-manager-windows-x64
          path: |
            dist/StageManagerSetup.exe
            dist/stage_manager.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/StageManagerSetup.exe
            dist/stage_manager.exe
          generate_release_notes: true
