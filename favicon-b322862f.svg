<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <filter id="tileGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Obsidian Rounded Backdrop -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="10"/>
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="3"/>

  <!-- Left Side Vertical Stage Strip Cards -->
  <rect x="76" y="86" width="110" height="80" rx="20" fill="url(#blueGrad)" filter="url(#tileGlow)"/>
  <rect x="76" y="196" width="110" height="80" rx="20" fill="url(#purpleGrad)" filter="url(#tileGlow)"/>
  <rect x="76" y="306" width="110" height="80" rx="20" fill="#334155" filter="url(#tileGlow)"/>

  <!-- Main Active Window Card -->
  <rect x="226" y="86" width="210" height="300" rx="24" fill="#1e293b" stroke="#38bdf8" stroke-width="4" filter="url(#tileGlow)"/>
</svg>
