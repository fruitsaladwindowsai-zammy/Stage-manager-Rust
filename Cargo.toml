[package]
name = "stage_manager"
version = "0.2.0"
edition = "2021"
default-run = "stage_manager"
description = "Native Windows Stage Manager in Rust with smooth DWM live thumbnails, per-monitor sidebars, virtual desktop isolation, and spring animations"

[[bin]]
name = "stage_manager"
path = "src/main.rs"

[[bin]]
name = "StageManagerSetup"
path = "src/bin/setup.rs"

[dependencies]
log = "0.4"

[dependencies.windows]
version = "0.58"
features = [
    "Foundation_Numerics",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
]

[profile.release]
opt-level = 3
lto = true
strip = true
