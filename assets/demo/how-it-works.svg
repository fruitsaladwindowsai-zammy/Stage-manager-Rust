<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="hoverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    @keyframes slideIn {
      0%, 15% { transform: translateX(-160px); opacity: 0.2; }
      25%, 85% { transform: translateX(0px); opacity: 1; }
      95%, 100% { transform: translateX(-160px); opacity: 0.2; }
    }
    @keyframes cursorMove {
      0% { transform: translate(480px, 270px); }
      18% { transform: translate(12px, 240px); }
      28% { transform: translate(80px, 210px); }
      55% { transform: translate(150px, 210px); }
      80% { transform: translate(450px, 250px); }
      100% { transform: translate(480px, 270px); }
    }
    @keyframes groupFanOut {
      0%, 30% { transform: translateX(0px); opacity: 0; }
      40%, 75% { transform: translateX(85px); opacity: 1; }
      85%, 100% { transform: translateX(0px); opacity: 0; }
    }
    @keyframes stagePop {
      0%, 25% { transform: scale(1); }
      35%, 75% { transform: scale(1.08) translateX(6px); }
      85%, 100% { transform: scale(1); }
    }
    .strip-group { animation: slideIn 10s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
    .cursor-pointer { animation: cursorMove 10s ease-in-out infinite; }
    .fan-out-card { animation: groupFanOut 10s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
    .hovered-stage { animation: stagePop 10s cubic-bezier(0.16, 1, 0.3, 1) infinite; transform-origin: 60px 210px; }
  </style>

  <!-- Background Monitor Frame -->
  <rect x="0" y="0" width="960" height="540" rx="12" fill="url(#screenGrad)"/>

  <!-- Desktop Active App Window -->
  <g transform="translate(230, 40)">
    <rect width="680" height="430" rx="10" fill="#1e1e2e" stroke="#45475a" stroke-width="1.5" filter="url(#cardShadow)"/>
    <!-- Window Titlebar -->
    <path d="M 0 10 Q 0 0 10 0 L 670 0 Q 680 0 680 10 L 680 34 L 0 34 Z" fill="#181825"/>
    <circle cx="20" cy="17" r="5" fill="#f38ba8"/>
    <circle cx="36" cy="17" r="5" fill="#f9e2af"/>
    <circle cx="52" cy="17" r="5" fill="#a6e3a1"/>
    <text x="340" y="22" fill="#cdd6f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" text-anchor="middle">Visual Studio Code — Stage Manager in Rust</text>
    
    <!-- Code Editor Mock Lines -->
    <rect x="30" y="55" width="220" height="12" rx="4" fill="#89b4fa" opacity="0.7"/>
    <rect x="30" y="78" width="180" height="10" rx="3" fill="#6c7086" opacity="0.6"/>
    <rect x="50" y="98" width="260" height="10" rx="3" fill="#a6e3a1" opacity="0.6"/>
    <rect x="50" y="118" width="310" height="10" rx="3" fill="#f9e2af" opacity="0.6"/>
    <rect x="70" y="138" width="190" height="10" rx="3" fill="#cba6f7" opacity="0.6"/>
    <rect x="50" y="158" width="140" height="10" rx="3" fill="#6c7086" opacity="0.6"/>
    <rect x="30" y="188" width="280" height="10" rx="3" fill="#89b4fa" opacity="0.6"/>
    <rect x="50" y="208" width="220" height="10" rx="3" fill="#f38ba8" opacity="0.6"/>
    <rect x="50" y="228" width="340" height="10" rx="3" fill="#a6e3a1" opacity="0.6"/>
    <rect x="30" y="258" width="160" height="10" rx="3" fill="#cba6f7" opacity="0.6"/>
  </g>

  <!-- Left Trigger Zone Indicator -->
  <rect x="0" y="0" width="16" height="495" fill="#38bdf8" opacity="0.25">
    <animate attributeName="opacity" values="0.15;0.4;0.15" dur="3s" repeatCount="indefinite" />
  </rect>

  <!-- Stage Manager Left Floating Strip -->
  <g class="strip-group">
    <!-- Stage 1 (Top) -->
    <g transform="translate(24, 45)">
      <rect width="110" height="68" rx="8" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.2" filter="url(#cardShadow)"/>
      <rect x="8" y="8" width="94" height="52" rx="4" fill="#0f172a" opacity="0.5"/>
      <!-- App Icon Squircle -->
      <rect x="-10" y="18" width="30" height="30" rx="8" fill="#ea4335" filter="url(#cardShadow)"/>
      <text x="5" y="38" fill="#fff" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">G</text>
    </g>

    <!-- Stage 2 (Hovered / Active Stage with Multi-Window Fan-Out) -->
    <g class="hovered-stage" transform="translate(24, 135)">
      <!-- Fanned-out second window from grouped app -->
      <g class="fan-out-card">
        <rect x="0" y="0" width="110" height="68" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#cardShadow)"/>
        <rect x="8" y="8" width="94" height="52" rx="4" fill="#1e293b" opacity="0.7"/>
        <rect x="-10" y="18" width="30" height="30" rx="8" fill="#0ea5e9" filter="url(#cardShadow)"/>
        <text x="5" y="38" fill="#fff" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">W2</text>
        <text x="55" y="40" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Window 2</text>
      </g>

      <!-- Primary Stage Card -->
      <rect width="110" height="68" rx="8" fill="url(#cardGrad)" stroke="#60a5fa" stroke-width="2" filter="url(#glow)"/>
      <rect x="8" y="8" width="94" height="52" rx="4" fill="#1e293b" opacity="0.8"/>
      <!-- App Icon Squircle -->
      <rect x="-10" y="18" width="30" height="30" rx="8" fill="#2563eb" filter="url(#cardShadow)"/>
      <text x="5" y="38" fill="#fff" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">W1</text>
      <text x="55" y="40" fill="#93c5fd" font-family="sans-serif" font-size="9" text-anchor="middle">Window 1</text>
      <!-- Group badge indicator -->
      <circle cx="98" cy="12" r="9" fill="#38bdf8"/>
      <text x="98" y="15" fill="#0f172a" font-family="sans-serif" font-weight="bold" font-size="9" text-anchor="middle">2</text>
    </g>

    <!-- Stage 3 -->
    <g transform="translate(24, 225)">
      <rect width="110" height="68" rx="8" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.2" filter="url(#cardShadow)"/>
      <rect x="8" y="8" width="94" height="52" rx="4" fill="#0f172a" opacity="0.5"/>
      <rect x="-10" y="18" width="30" height="30" rx="8" fill="#10b981" filter="url(#cardShadow)"/>
      <text x="5" y="38" fill="#fff" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">T</text>
    </g>

    <!-- Stage 4 (Bottom) -->
    <g transform="translate(24, 315)">
      <rect width="110" height="68" rx="8" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.2" filter="url(#cardShadow)"/>
      <rect x="8" y="8" width="94" height="52" rx="4" fill="#0f172a" opacity="0.5"/>
      <rect x="-10" y="18" width="30" height="30" rx="8" fill="#f59e0b" filter="url(#cardShadow)"/>
      <text x="5" y="38" fill="#fff" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">F</text>
    </g>
  </g>

  <!-- Windows Taskbar at Bottom -->
  <rect x="0" y="495" width="960" height="45" fill="#0b0f17" opacity="0.95"/>
  <rect x="0" y="495" width="960" height="1" fill="#334155"/>
  
  <!-- Centered Taskbar Icons (Win11 style) -->
  <g transform="translate(440, 506)">
    <!-- Start Button -->
    <rect x="0" y="0" width="22" height="22" rx="4" fill="#0284c7"/>
    <path d="M 4 4 L 10 4 L 10 10 L 4 10 Z M 12 4 L 18 4 L 18 10 L 12 10 Z M 4 12 L 10 12 L 10 18 L 4 18 Z M 12 12 L 18 12 L 18 18 L 12 18 Z" fill="#fff"/>
    <!-- App Icons in Taskbar -->
    <rect x="32" y="1" width="20" height="20" rx="4" fill="#3b82f6"/>
    <rect x="62" y="1" width="20" height="20" rx="4" fill="#10b981"/>
    <rect x="92" y="1" width="20" height="20" rx="4" fill="#f59e0b"/>
  </g>

  <!-- System Tray on Right with Stage Manager Icon -->
  <g transform="translate(860, 508)">
    <!-- Stage Manager Tray Squircle -->
    <rect x="0" y="0" width="18" height="18" rx="5" fill="#38bdf8"/>
    <circle cx="9" cy="9" r="4" fill="#0f172a"/>
    <text x="45" y="14" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">12:00</text>
  </g>

  <!-- Animated Mouse Cursor Pointer -->
  <g class="cursor-pointer">
    <path d="M 0 0 L 0 20 L 5 16 L 9 24 L 12 22 L 8 15 L 14 15 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5" filter="url(#cardShadow)"/>
  </g>

  <!-- Annotation Labels -->
  <g transform="translate(145, 18)">
    <rect x="0" y="0" width="280" height="24" rx="12" fill="#0284c7" opacity="0.9"/>
    <text x="140" y="16" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Cursor to edge → Spring slide &amp; Group fan-out</text>
  </g>
</svg>
